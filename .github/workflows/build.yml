name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aidata:
    name: aidata (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tooling
        # aidata is stdlib-only in production — no requirements file to install.
        # Only the test/lint tooling is needed.
        #
        # ruff is PINNED on purpose: it is a fast-moving linter whose default
        # rule set changes between releases. An unpinned `pip install ruff`
        # means a new release can turn CI red with no code change — exactly the
        # flakiness a gate must not have. Bump this deliberately, with the
        # resulting fixes in the same commit.
        run: python -m pip install --upgrade pip pytest 'ruff==0.15.13'
      - name: pytest
        # The warehouse (L3_merge/warehouse.db) is a gitignored local artifact,
        # so integration tests that need it skip themselves here. The hermetic
        # unit tests — including the digest golden — must pass.
        working-directory: aidata
        run: python -m pytest tests/ -q
      - name: ruff (production code + tests)
        # Data layers are gitignored, but exclude them explicitly so a stray
        # local artifact can never fail CI.
        working-directory: aidata
        run: ruff check . --exclude L1_collect,L2_normalize,L3_merge
      - name: Degrade-not-crash — imports clean with no config_local.py
        # config_local.py is git-ignored, so CI is the real "fresh clone" test:
        # every source must degrade to a no-op rather than raise (ADR-23).
        working-directory: aidata
        run: |
          set -euo pipefail
          test ! -f config_local.py  # sanity: it must never be committed
          python -c "
          import config, adapters.ado_pr as ado, adapters.github_pr as gh
          assert config.ADO_ORG == '', 'ADO_ORG should default empty'
          assert config.MULTICA_WORKSPACES == (), 'workspaces should default empty'
          assert config.GITHUB_PR_REPOS == (), 'GITHUB_PR_REPOS should default empty'
          assert ado.collect() == 0, 'ado_pr must degrade to 0'
          assert gh.collect() == 0, 'github_pr must degrade to 0'
          print('degrade-not-crash OK')
          "

  swiftlint:
    name: swiftlint (root config)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/realm/swiftlint:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint (root .swiftlint.yml, strict)
        # Same config + flags as pre-commit (per-file) and pre-push (full).
        # This is the authoritative, unbypassable style gate — the only one
        # that holds against `git commit/push --no-verify`.
        run: swiftlint lint --strict --config .swiftlint.yml

  require-tests:
    name: require-tests (改代码必带测试)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute diff range
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            # push to main: compare against the previous tip
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # first push / force scenarios may lack a valid before
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse "$head~1" 2>/dev/null || echo "$head")"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Diff-size advisory
        run: scripts/quality/check-diff-size.sh "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"
      - name: Require tests (blocking)
        run: scripts/quality/require-tests.sh "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

  review-gate:
    name: review-gate (pytest)
    # The automated review gates (claude / codex) resolve Swift modifier scope
    # from exact-HEAD source before they may raise an attachment blocker. That
    # resolver is the thing standing between an ambiguous hunk and a false
    # high-severity finding (MY-1402 / PR #171), so it carries its own tests
    # and its own CI job — it is not covered by any Swift or aidata job.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test tooling
        # Stdlib-only in production; same pinned ruff as the aidata job so a
        # new linter release cannot turn this gate red with no code change.
        run: python -m pip install --upgrade pip pytest 'ruff==0.15.13'
      - name: pytest
        working-directory: scripts/ci
        run: python -m pytest tests/ -q
      - name: ruff
        working-directory: scripts/ci
        run: ruff check .

  build:
    name: build + test (macOS 26)
    # macos-26 runner ships Xcode 26.x (Swift 6.2), which AIDashUI requires
    # (Package.swift declares swift-tools-version: 6.2). macos-latest defaults
    # to Xcode 16.4 / Swift 6.1 and fails package resolution.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anti-rot — frontmatter matches code
        run: scripts/hooks/check-frontmatter

      - name: Anti-rot — tasks.md in sync with spec + single-layer
        run: scripts/hooks/check-tasks-fresh

      - name: Gate — code changes must include tests
        # 改了 .swift 源码却没动任何测试文件 → 失败。逃生舱:PR 任一 commit
        # message 含 "Allow-No-Tests:"。PR 用 base..head;push-to-main 用 before..after。
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # 新分支/首次推送时 before 可能是全零;退化为只看最后一个 commit
          if ! git cat-file -e "$base" 2>/dev/null; then
            base="$head~1"
          fi
          changed="$(git diff --name-only "$base..$head")"
          src="$(echo "$changed" | grep -E '\.swift$' | grep -vE '(^|/)Tests/|Tests?\.swift$' || true)"
          tst="$(echo "$changed" | grep -E '(^|/)Tests/|Tests?\.swift$' || true)"
          if [ -n "$src" ] && [ -z "$tst" ]; then
            if git log "$base..$head" --format=%B | grep -qi '^Allow-No-Tests:'; then
              echo "⚠️ 改了源码但无测试改动;因 Allow-No-Tests: 放行。"
            else
              echo "❌ 改了源码(.swift)但无测试改动。补测试或在 commit message 写 Allow-No-Tests: <原因>"
              echo "$src"
              exit 1
            fi
          fi

      - name: Select Xcode 26 (Swift 6.2)
        # Even on macos-26 the default xcode-select may point at an older
        # Xcode; pick the highest installed Xcode_26*.app explicitly so
        # `xcodebuild` / `swift` see Swift 6.2 unconditionally.
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -Vr | head -n1 || true)
          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: no Xcode 26.x found on runner. Installed Xcode apps:"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: swift test (AIDashCore)
        run: swift test --package-path Packages/AIDashCore

      - name: Build AIDashApp (macOS)
        run: |
          xcodebuild \
            -scheme AIDashApp \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build AIDashApp (iOS)
        # 宪法 §Testing gate 1(四端构建门)的 iOS 边。AIDashApp 是
        # supportedDestinations: [macOS, iOS] 的单 target,generic/platform=iOS
        # 编一次即覆盖 iPhone/iPad(同 target、同代码),不必再加 iPad destination。
        #
        # 这个门防的是 T201 那类回归:macOS 专属 API(SecCode 等)悄悄漏进
        # 共用代码路径,macOS 绿、iOS 却编不过——只跑 macOS 的话看不见。
        # CI 不签名,所以 CODE_SIGNING_ALLOWED=NO(entitlements 按 SDK 拆分见 T202)。
        run: |
          xcodebuild \
            -scheme AIDashApp \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build aidash CLI (macOS)
        run: |
          xcodebuild \
            -scheme aidash \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
