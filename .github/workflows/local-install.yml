name: local-install

on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'Packages/**'
      - 'CLI/**'
      - 'Configs/**'
      - 'project.yml'
      - 'scripts/dev/**'
      - '.github/workflows/local-install.yml'
  workflow_dispatch:

concurrency:
  group: local-install-main
  cancel-in-progress: false

jobs:
  install-fixed-build:
    name: Install fixed build on local Mac
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, aidash-leemini]
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Install fixed build to /Applications/AIDash.app
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ./scripts/dev/install-fixed-build.sh
      - name: Fast-forward local ~/Development/AIDash checkout (best-effort)
        run: |
          set -euo pipefail
          LOCAL_REPO="$HOME/Development/AIDash"
          if [ -d "$LOCAL_REPO/.git" ] && [ -z "$(git -C "$LOCAL_REPO" status --porcelain)" ] && [ "$(git -C "$LOCAL_REPO" branch --show-current)" = "main" ]; then
            AIDASH_SKIP_POST_MERGE_INSTALL=1 git -C "$LOCAL_REPO" pull --ff-only origin main || true
          fi
