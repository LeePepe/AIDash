name: testflight

# Post-merge pushes to main release app-relevant changes automatically.
# Manual dispatch remains available; force bypasses only path relevance and may
# bootstrap a missing release marker.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore path relevance and release the selected main commit'
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & upload to TestFlight
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, aidash-mac]
    timeout-minutes: 40
    steps:
      - name: Select exact candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$EVENT_REF" != "refs/heads/main" ]; then
              echo "::error::Unexpected automatic release ref"
              exit 1
            fi
            CANDIDATE="$EVENT_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CANDIDATE="$(
              git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main |
                awk 'NR == 1 { print $1 }'
            )"
          else
            echo "::error::Unexpected release event"
            exit 1
          fi
          if ! printf '%s\n' "$CANDIDATE" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Could not resolve an exact release candidate"
            exit 1
          fi
          echo "sha=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Evaluate marker and app relevance
        id: gate
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          MARKER_REF="refs/tags/testflight/last-released"
          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          set_output candidate "$CANDIDATE_SHA"
          set_output force "$FORCE"
          set_output release false

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git rev-parse HEAD)" != "$CANDIDATE_SHA" ]; then
            set_output outcome failed-candidate-mismatch
            echo "::error::Checkout does not match the pinned candidate"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main; then
            set_output outcome failed-unreachable-candidate
            echo "::error::Candidate is not reachable from official main"
            exit 1
          fi

          MARKER_OID="$(
            git ls-remote --tags origin "$MARKER_REF" |
              awk -v ref="$MARKER_REF" '$2 == ref { print $1 }'
          )"
          set_output marker_oid "$MARKER_OID"

          if [ -z "$MARKER_OID" ]; then
            set_output marker_state missing
            if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$FORCE" != "true" ]; then
              set_output outcome failed-missing-marker
              echo "::error::Release marker is missing; only manual force may bootstrap it"
              exit 1
            fi
            set_output relevant forced-bootstrap
            set_output release true
            set_output outcome eligible
            exit 0
          fi

          git fetch --no-tags origin "+$MARKER_REF:$MARKER_REF"
          if [ "$(git cat-file -t "$MARKER_OID")" != "commit" ]; then
            set_output marker_state invalid
            set_output outcome failed-invalid-marker
            echo "::error::Release marker must be a lightweight tag"
            exit 1
          fi
          if [ "$MARKER_OID" = "$CANDIDATE_SHA" ]; then
            set_output marker_state equal
            set_output relevant not-evaluated
            set_output outcome skipped-already-released
            exit 0
          fi
          if ! git merge-base --is-ancestor "$MARKER_OID" "$CANDIDATE_SHA"; then
            set_output marker_state non-ancestor
            set_output relevant not-evaluated
            set_output outcome failed-unsafe-marker
            echo "::error::Release marker is not an ancestor of the candidate"
            exit 1
          fi
          set_output marker_state ancestor

          BASE_SHA="$MARKER_OID"
          # CLASSIFIER-BEGIN
          RELEVANT=false
          while IFS= read -r -d '' path; do
            case "$path" in
              Apps/AIDashApp/*|Packages/AIDashCore/*|Packages/AIDashUI/*|Packages/DesignKit/*|Configs/*|project.yml|fastlane/*)
                RELEVANT=true
                break
                ;;
            esac
          done < <(git diff --name-only -z "$BASE_SHA..$CANDIDATE_SHA")
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          # CLASSIFIER-END

          if [ "$RELEVANT" != "true" ] && [ "$FORCE" != "true" ]; then
            set_output outcome skipped-no-app-changes
            exit 0
          fi
          set_output release true
          set_output outcome eligible

      - name: Verify Xcode
        if: steps.gate.outputs.release == 'true'
        run: |
          echo "Using: $(xcode-select -p)"
          xcodebuild -version

      - name: Ensure xcodegen + fastlane
        if: steps.gate.outputs.release == 'true'
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list fastlane >/dev/null 2>&1 || brew install fastlane

      - name: Verify API key secrets
        if: steps.gate.outputs.release == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 ASC_TEAM_ID; do
            if [ -z "$(eval "echo \${$name:-}")" ]; then
              echo "::error::$name secret is not configured"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Unlock login keychain for codesign
        id: keychain
        if: steps.gate.outputs.release == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::KEYCHAIN_PASSWORD secret is not configured"
            exit 1
          fi
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" \
            "$HOME/Library/Keychains/login.keychain-db"

      - name: fastlane ios beta
        id: upload
        if: steps.gate.outputs.release == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          AIDASH_DEVELOPMENT_TEAM: ${{ secrets.ASC_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
        run: fastlane ios beta

      - name: Compare-and-swap last-released marker
        id: marker
        if: steps.upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          EXPECTED_MARKER: ${{ steps.gate.outputs.marker_oid }}
        run: |
          set -euo pipefail
          MARKER_REF="refs/tags/testflight/last-released"
          LEASE="${MARKER_REF}:${EXPECTED_MARKER}"
          git push --force-with-lease="$LEASE" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${CANDIDATE_SHA}:${MARKER_REF}"

      - name: Cleanup and summarize
        if: always()
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          MARKER_STATE: ${{ steps.gate.outputs.marker_state }}
          RELEVANT: ${{ steps.gate.outputs.relevant }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          GATE_OUTCOME: ${{ steps.gate.outputs.outcome }}
          MARKER_OUTCOME: ${{ steps.marker.outcome }}
          KEYCHAIN_ATTEMPTED: ${{ steps.keychain.outputs.attempted }}
        run: |
          set -u
          cleanup_warning=false
          if [ "$KEYCHAIN_ATTEMPTED" = "true" ]; then
            if ! security lock-keychain "$HOME/Library/Keychains/login.keychain-db"; then
              echo "::warning::Could not re-lock the login keychain"
              cleanup_warning=true
            fi
          fi
          if ! git update-ref -d refs/tags/testflight/last-released; then
            echo "::warning::Could not remove the local release marker"
            cleanup_warning=true
          fi

          if [ "$MARKER_OUTCOME" = "success" ]; then
            FINAL_OUTCOME=success
            CAS_RESULT=success
          elif [[ "$GATE_OUTCOME" == skipped-* ]]; then
            FINAL_OUTCOME="$GATE_OUTCOME"
            CAS_RESULT=not-attempted
          else
            FINAL_OUTCOME=failed
            CAS_RESULT=not-completed
          fi
          if ! {
            echo "## TestFlight release"
            echo "- Candidate: \`${CANDIDATE_SHA:-unresolved}\`"
            echo "- Marker state: \`${MARKER_STATE:-unknown}\`"
            echo "- Relevance: \`${RELEVANT:-not-evaluated}\`"
            echo "- Force: \`${FORCE:-false}\`"
            echo "- Marker CAS: \`$CAS_RESULT\`"
            echo "- Outcome: \`$FINAL_OUTCOME\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Could not write the release summary"
            cleanup_warning=true
          fi
          if [ "$cleanup_warning" = "true" ] && [ "$MARKER_OUTCOME" = "success" ]; then
            echo "::warning::Release succeeded; cleanup reported a warning"
          fi
