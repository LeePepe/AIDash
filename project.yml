name: AIDash
options:
  bundleIdPrefix: com.tianpli
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true

# 身份配置单源:Bundle ID / CloudKit 容器 / 开发者团队。
# fork 后只改 Configs/Identity.xcconfig 一个文件即可,见该文件顶部说明。
configFiles:
  Debug: Configs/Identity.xcconfig
  Release: Configs/Identity.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # 版本号单源。Info.plist 的 CFBundleShortVersionString / CFBundleVersion
    # 引用这两个 build setting,所以:
    #   - MARKETING_VERSION      = 人读版本,发新版时改这里一处。
    #   - CURRENT_PROJECT_VERSION = build number 默认值,TestFlight 发布时由
    #     fastlane 的 xcargs(CURRENT_PROJECT_VERSION=N,N=ASC 上最大 build+1)覆盖。
    # 写死在 Info.plist 里的话 xcargs 覆盖不到,每次上传都是 build 1 → ASC 拒收重复。
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer team — 值来自 Configs/Identity.xcconfig。
    # 固定在这里,避免 `xcodegen generate` 抹掉 AIDash.xcodeproj 里的 team 选择。
    # CI 用 CODE_SIGNING_ALLOWED=NO,所以在 runner 上会被忽略。
    DEVELOPMENT_TEAM: $(AIDASH_DEVELOPMENT_TEAM)

packages:
  AIDashCore:
    path: Packages/AIDashCore
  AIDashUI:
    path: Packages/AIDashUI
  DesignKit:
    path: Packages/DesignKit
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser
    from: "1.5.0"

targets:
  AIDashApp:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Apps/AIDashApp/Sources
      - path: Apps/AIDashApp/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDASH_BUNDLE_ID)
        PRODUCT_NAME: AIDash
        # Swift module name is pinned to AIDashApp (not the AIDash product name)
        # so `@testable import AIDashApp` in the app-target tests resolves.
        PRODUCT_MODULE_NAME: AIDashApp
        INFOPLIST_FILE: Apps/AIDashApp/Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Apps/AIDashApp/AIDashApp.macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Apps/AIDashApp/AIDashApp.iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Apps/AIDashApp/AIDashApp.iOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        INFOPLIST_KEY_LSUIElement[sdk=macosx*]: YES
    dependencies:
      - package: AIDashCore
      - package: AIDashUI
      - package: DesignKit

  AIDashAppTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Apps/AIDashApp/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDASH_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        # The host app's PRODUCT_NAME is `AIDash` (not the target name
        # `AIDashApp`), so XcodeGen's default TEST_HOST of
        # `…/AIDashApp.app/AIDashApp` doesn't exist and the test bundle can't
        # load. Pin TEST_HOST + BUNDLE_LOADER to the real product so the
        # app-target tests (RunMode, LaunchdAgentInstaller, live XPC e2e) run.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AIDash.app/Contents/MacOS/AIDash"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AIDashApp
      - package: AIDashCore

  aidash:
    type: tool
    platform: macOS
    sources:
      - path: CLI/aidash/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDASH_BUNDLE_ID).cli
        PRODUCT_NAME: aidash
        SKIP_INSTALL: NO
    dependencies:
      - package: AIDashCore
      - package: swift-argument-parser
        product: ArgumentParser

  aidashTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CLI/aidash/Tests
      - path: CLI/aidash/Sources/XPCClient
      - path: CLI/aidash/Sources/Commands
      - path: CLI/aidash/Sources/Output
      - path: CLI/aidash/Sources/ExitCode.swift
      - path: CLI/aidash/Sources/DateResolver.swift
      - path: CLI/aidash/Sources/SchemaListRendering.swift
      - path: CLI/aidash/Sources/PayloadResolver.swift
    dependencies:
      - package: AIDashCore
      - package: swift-argument-parser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIDASH_BUNDLE_ID).cli.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIDashApp:
    build:
      targets:
        AIDashApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AIDashAppTests
    archive:
      config: Release
  aidash:
    build:
      targets:
        aidash: all
    run:
      config: Debug
    test:
      targets:
        - aidashTests
    archive:
      config: Release
